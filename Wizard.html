<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="wizard.css">
</head>

<body>
    <section class="container">
        <div class="contains-inline">
            <ol class="stepper sm:stepper-horizontal">
                <li class="stepper-item active ">Product information</li>
                <li class="stepper-item ">Caractéristiques</li>
                <li class="stepper-item">Finish</li>
            </ol>
        </div>
        <form id="form">
            <!-- first stepp -->
            <div class="first-step">
                <div>
                    <h2>Product information</h2>
                </div>
                <div class="input-grp">
                    <label for="product-name">Product Name*</label>
                    <input type="text" name="product-name">
                    <span class="erro-message"></span>
                </div>
                <div class="input-grp">
                    <label for="product-categorie">Product Categorie*</label>
                    <input type="text" name="product-categorie">
                    <span class="erro-message"></span>
                </div>
                <div class="input-grp">
                    <label for="product-price">Price*</label>
                    <input type="number" name="product-price">
                    <label for="des">Description
                        <textarea id="des"></textarea>
                    </label>
                    <span class="erro-message"></span>
                </div>
                <div class="input-grp">
                    <label for="product-image">Image URL*</label>
                    <input type="url" name="product-image">
                    <span class="erro-message"></span>
                </div>

                <div class="input-grp">
                    <label for="product-price">Prix de base*</label>
                    <input type="checkbox" name="product-price">
                    <span class="erro-message"></span>
                </div>
                <div>
                    <div class="input-grp">
                        <label for="product-discount">Pourcentage de réduction*</label>
                        <input type="number" name="product-discount">
                        <span class="erro-message"></span>
                    </div>
                    <div>
                        <div class="input-grp">
                            <label for="product-discount-date">Date de fin*</label>
                            <input type="date" name="product-discount-date">
                            <span class="erro-message"></span>
                        </div>
                        <button class="btn-text theme-primary">next</button>
                    </div>
                    <div class="second-step ">
                        <div>
                            <h2>Caractéristiques </h2>
                        </div>
                        <div class="input-group mb-3">
                            <label class="input-group-text" for="inputGroupSelect01">Type of grains</label>
                            <select class="form-control" id="inputGroupSelect01">
                                <option selected>Choose...</option>
                                <option value="1">Colombie</option>
                                <option value="2">Éthiopie</option>
                                <option value="3">Brésil</option>
                                <option value="3">Mélange Maison</option>
                            </select>
                        </div>
                        <div class="input-grp">
                            <label for="product-Intensité ">Niveau de torréfaction*</label>
                            <div class="form-range" data-bs-bubble>
                            <input type="range" class="form-range-input" min="0" max="10" value="10" id="rangeBubble">
                            </div>
                            <span class="erro-message"></span>
                        </div>
                        <div class="input-grp">
                            <label for="product-Température">Température *</label>
                            <input type="radio" name="product-Température">
                            <span class="Chaud">Chaud</span>
                            <input type="radio" name="product-Température" >
                            <span class="Glacé">Glacé</span>
                            <span class="erro-message"></span>
                        </div>
                        <div class="input-grp">
                            <label for="product-Tailles">Tailles disponibles*</label>
                            <input type="checkbox" name="product-Tailles"id="check" class="check" >
                            <span>Small</span>
                            <input type="checkbox" name="product-Tailles"id="check" class="check" >
                            <span>Medium</span>
                            <input type="checkbox" name="product-Tailles"id="check" class="check"  >
                            <span>Large</span>
                            <span class="erro-message"></span>
                        </div>
                        <div class="input-grp">
                            <label for="product-lait">Options de lait *</label>
                            <input type="checkbox" name="product-lait"id="check" class="check">
                            <span>Vache</span>
                            <input type="checkbox" name="product-lait"id="check" class="check">
                            <span>Avoine</span>
                            <input type="checkbox" name="product-lait"id="check" class="check">
                            <span>Soja</span>
                            <input type="checkbox" name="product-lait"id="check" class="check">
                            <span>Amande</span>
                            <span class="erro-message"></span>
                        </div>
                        <div class="input-grp">
                            <label for="Suppléments ">Suppléments *</label>
                            <input type="checkbox" name="Suppléments"id="check" class="check">
                            <span>Vanille</span>
                            <input type="checkbox" name="Suppléments"id="check" class="check">
                            <span>Caramel</span>
                            <input type="checkbox" name="Suppléments"id="check" class="check">
                            <span>Noisette</span>
                            <span class="erro-message"></span>
                        </div>
                        <div>
                            <button class="btn-text theme-danger">periviouse</button>
                            <button class="btn-text theme-primary">next</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </section>

</body>
<script src="Wizard.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>

</html>
